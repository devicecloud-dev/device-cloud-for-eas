name: Build Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUSH_APP_ID: ${{ secrets.PUSH_APP_ID }}
    steps:
      - name: Mint push token
        # devicecloud-push-bot (contents: write only) is a bypass actor on this repo's
        # rulesets, so it can push to the protected branch; GitHub Actions can't be one.
        # Falls back to GITHUB_TOKEN while PUSH_APP_ID / PUSH_APP_PRIVATE_KEY are unset.
        id: push-token
        if: env.PUSH_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PUSH_APP_ID }}
          private-key: ${{ secrets.PUSH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install

      - name: Compile files
        run: pnpm build

      - name: Setup Git Credentials
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Commit Files
        continue-on-error: true
        run: |
          git add dist/index.js -f
          # [skip ci]: app-token pushes start workflows (GITHUB_TOKEN pushes
          # never did). This keeps it that way.
          git commit -m "[CI] Add changes" -m "[skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ steps.push-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: main
