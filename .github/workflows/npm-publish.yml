name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - next
          - beta

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Mints the OIDC token npm exchanges for publish rights. npm knows this
      # repo as a trusted publisher, so there is no long-lived NPM_TOKEN to
      # expire — but without this the job can't prove who it is and the
      # registry answers 404 on the PUT.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION} under dist-tag '${{ inputs.dist_tag }}'"

      # No NODE_AUTH_TOKEN: a token in the environment takes precedence and
      # would put us back on the credential that expired.
      - name: Publish to npm
        run: pnpm publish --tag ${{ inputs.dist_tag }} --no-git-checks --access public

      # Releases are often cut on GitHub first, which already creates the tag.
      # Don't fail a successful publish just because the tag is there.
      - name: Create and push git tag
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin - nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${TAG}"
